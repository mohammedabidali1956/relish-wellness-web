
name: Auto Sync Fork

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/relishphysio1/relish-wellness-web.git
          git fetch upstream
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
